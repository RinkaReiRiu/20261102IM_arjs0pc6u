<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>AR GLB 圖片與影片</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- GLB 動畫載入器 -->
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>

    <!-- AR.js 手勢工具 -->
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        #start-button {
            position: fixed;
            z-index: 9999;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            background: #1677ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- 第一次點擊後啟動影片與攝影機互動 -->
    <button id="start-button">開始 AR</button>

    <a-scene
        id="scene"
        embedded
        gesture-detector
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false"
        renderer="logarithmicDepthBuffer: true; alpha: true;"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

        <a-assets>

            <!-- GLB 模型 -->
            <a-asset-item
                id="animated-asset"
                src="assets/asset.glb">
            </a-asset-item>

            <!-- 圖片 -->
            <img
                id="my-image"
                src="assets/image.png"
                crossorigin="anonymous">

            <!-- 影片 -->
            <video
                id="my-video"
                src="assets/video.mp4"
                preload="auto"
                loop
                muted
                playsinline
                webkit-playsinline
                crossorigin="anonymous">
            </video>

        </a-assets>

        <!-- 自訂圖案 marker -->
        <a-marker
            id="markerA"
            type="pattern"
            preset="custom"
            url="assets/marker.patt"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse">

            <!-- GLB 模型 -->
            <a-entity
                id="bowser-model"
                gltf-model="#animated-asset"
                position="0 0 0"
                rotation="0 0 0"
                scale="1.8 1.8 1.8"
                animation-mixer="loop: repeat"
                class="clickable"
                gesture-handler>
            </a-entity>

            <!-- 圖片 -->
            <a-image
                id="image-plane"
                src="#my-image"
                position="1.3 0.8 0"
                rotation="0 0 0"
                width="1"
                height="0.7">
            </a-image>

            <!-- 影片 -->
            <a-video
                id="video-plane"
                src="#my-video"
                position="0 1.5 0"
                rotation="-90 0 0"
                width="1.6"
                height="0.9"
                material="shader: flat">
            </a-video>

        </a-marker>

        <!-- AR 攝影機 -->
        <a-entity camera></a-entity>

    </a-scene>

    <script>
        const startButton = document.querySelector('#start-button');
        const video = document.querySelector('#my-video');
        const marker = document.querySelector('#markerA');

        let arStarted = false;

        /*
         * 按下「開始 AR」
         * 主要用途是取得手機瀏覽器的影片播放權限
         */
        startButton.addEventListener('click', function () {
            video.play()
                .then(function () {
                    video.pause();
                    video.currentTime = 0;
                })
                .catch(function (error) {
                    console.log('影片尚未取得播放權限：', error);
                });

            startButton.style.display = 'none';
            arStarted = true;
        });

        /*
         * 找到 marker 時播放影片
         */
        marker.addEventListener('markerFound', function () {
            console.log('Marker found');

            if (arStarted) {
                video.play().catch(function (error) {
                    console.log('影片播放失敗：', error);
                });
            }
        });

        /*
         * Marker 消失時暫停影片
         */
        marker.addEventListener('markerLost', function () {
            console.log('Marker lost');
            video.pause();
        });

        /*
         * 點擊影片時播放或暫停
         */
        const videoPlane = document.querySelector('#video-plane');

        videoPlane.addEventListener('click', function () {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        });
    </script>

</body>

</html>
